name: Node CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: npm-shrinkwrap.json
            - name: Install dependencies
              run: npm ci
            - name: Test
              run: npm test
            - name: Build
              run: |
                  npm run build
                  node ./dist/index.js --version
            - name: Check code style
              run: npm run lint
        env:
            CI: true
